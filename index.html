<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>$ Tracker Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --accent: #0a84ff;
      --text: #ffffff;
      --subtext: #8e8e93;
      --danger: #ff453a;
      --success: #30d158;
      --border: #2c2c2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); background: #000; position: sticky; top: 0; z-index: 100; }
    .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .badge-pro { background: var(--accent); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }

    main { padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
    .card-label { font-size: 11px; text-transform: uppercase; color: var(--subtext); letter-spacing: 0.5px; font-weight: 600; }
    .card-value { font-size: 34px; font-weight: 800; margin-top: 4px; }

    .list-item { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
    .item-title { font-weight: 600; font-size: 15px; }
    .item-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }
    .item-amount { font-weight: 700; font-size: 16px; color: var(--danger); }

    .fab { position: fixed; bottom: 85px; right: 20px; width: 56px; height: 56px; background: var(--accent); border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; border: none; box-shadow: 0 4px 12px rgba(10,132,255,0.4); z-index: 99; }

    nav { position: fixed; bottom: 0; width: 100%; background: #121212; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--subtext); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-btn.active { color: var(--accent); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: flex-end; flex-direction: column; }
    .modal-sheet { background: var(--card); border-radius: 24px 24px 0 0; padding: 24px; gap: 16px; display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
    
    input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 12px; font-size: 16px; width: 100%; outline: none; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; text-align: center; width: 100%; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-scan { background: #1c2733; color: var(--accent); border: 1px dashed var(--accent); }

    #ocr-status { font-size: 12px; color: var(--accent); text-align: center; min-height: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">$ Tracker <span class="badge-pro">PRO UNLOCKED</span></div>
  </header>

  <main>
    <!-- ACTIVITY TAB -->
    <section id="tab-activity" class="tab-content active">
      <div class="card">
        <div class="card-label">Total Spent This Month</div>
        <div class="card-value" id="month-total">$0.00</div>
      </div>
      <h3 style="margin-bottom: 12px; font-size: 16px;">Recent Transactions</h3>
      <div id="tx-list"></div>
    </section>

    <!-- ANALYTICS / REPORTS TAB -->
    <section id="tab-reports" class="tab-content">
      <div class="card">
        <div class="card-label">PRO ANALYTICS SUMMARY</div>
        <div id="analytics-summary" style="margin-top: 10px; font-size: 14px; line-height: 1.6;"></div>
      </div>
      <button class="btn btn-secondary" onclick="exportCSV()">📥 Export All Data to CSV</button>
    </section>

    <!-- SETTINGS TAB -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h3>Pro Features Enabled</h3>
        <p style="font-size: 13px; color: var(--subtext); margin-top: 6px;">• Unlimited OCR Receipt Scanning<br>• Custom Category Builder<br>• Unlimited Export & Multi-Sheet Support</p>
      </div>
      <button class="btn btn-secondary" style="color: var(--danger);" onclick="clearAllData()">Clear All App Data</button>
    </section>
  </main>

  <button class="fab" onclick="openModal()">+</button>

  <nav>
    <button class="nav-btn active" onclick="switchTab('activity', this)">Activity</button>
    <button class="nav-btn" onclick="switchTab('reports', this)">Reports</button>
    <button class="nav-btn" onclick="switchTab('settings', this)">Settings</button>
  </nav>

  <!-- ADD / SCANNER MODAL -->
  <div class="modal" id="entry-modal">
    <div class="modal-sheet">
      <h3 style="text-align: center;">New Transaction</h3>
      
      <button class="btn btn-scan" onclick="document.getElementById('receipt-input').click()">📷 Auto-Scan Receipt with AI</button>
      <input type="file" id="receipt-input" accept="image/*" capture="environment" style="display:none" onchange="processReceipt(this)">
      <div id="ocr-status"></div>

      <input type="number" step="0.01" id="tx-amount" placeholder="0.00">
      <input type="text" id="tx-merchant" placeholder="Merchant / Note">
      
      <select id="tx-category">
        <option value="Food & Dining">Food & Dining</option>
        <option value="Groceries">Groceries</option>
        <option value="Transportation">Transportation</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills & Utilities">Bills & Utilities</option>
      </select>

      <button class="btn" onclick="saveTransaction()">Save Transaction</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('pro_tracker_txs') || '[]');

    function saveToStorage() {
      localStorage.setItem('pro_tracker_txs', JSON.stringify(transactions));
      render();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'reports') renderReports();
    }

    function openModal() { document.getElementById('entry-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('entry-modal').style.display = 'none'; resetForm(); }

    function resetForm() {
      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-merchant').value = '';
      document.getElementById('ocr-status').innerText = '';
    }

    async function processReceipt(input) {
      const file = input.files[0];
      if (!file) return;

      const statusEl = document.getElementById('ocr-status');
      statusEl.innerText = "Scanning receipt with AI OCR...";

      try {
        const result = await Tesseract.recognize(file, 'eng');
        const text = result.data.text;
        
        // Match largest dollar amount from text
        const amounts = text.match(/\d+\.\d{2}/g);
        if (amounts) {
          const maxAmount = Math.max(...amounts.map(Number));
          document.getElementById('tx-amount').value = maxAmount.toFixed(2);
        }

        // Try extracting merchant line
        const lines = text.split('\n').filter(l => l.trim().length > 2);
        if (lines.length > 0) {
          document.getElementById('tx-merchant').value = lines[0].trim().substring(0, 25);
        }

        statusEl.innerText = "✨ Receipt Scanned & Filled Successfully!";
      } catch (err) {
        statusEl.innerText = "Could not parse receipt automatically.";
      }
    }

    function saveTransaction() {
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const merchant = document.getElementById('tx-merchant').value || 'Uncategorized';
      const category = document.getElementById('tx-category').value;

      if (!amount || amount <= 0) return alert('Enter a valid amount');

      transactions.unshift({
        id: Date.now(),
        amount,
        merchant,
        category,
        date: new Date().toLocaleDateString()
      });

      saveToStorage();
      closeModal();
    }

    function render() {
      const list = document.getElementById('tx-list');
      const totalEl = document.getElementById('month-total');
      list.innerHTML = '';

      let total = 0;
      transactions.forEach(t => {
        total += t.amount;
        list.innerHTML += `
          <div class="list-item">
            <div>
              <div class="item-title">${t.merchant}</div>
              <div class="item-sub">${t.category} • ${t.date}</div>
            </div>
            <div class="item-amount">-$${t.amount.toFixed(2)}</div>
          </div>
        `;
      });

      totalEl.innerText = `$${total.toFixed(2)}`;
    }

    function renderReports() {
      const el = document.getElementById('analytics-summary');
      if (transactions.length === 0) {
        el.innerText = 'No transaction data available yet.';
        return;
      }

      let total = transactions.reduce((acc, t) => acc + t.amount, 0);
      let categories = {};
      transactions.forEach(t => categories[t.category] = (categories[t.category] || 0) + t.amount);

      let breakdown = Object.entries(categories)
        .map(([cat, amt]) => `• ${cat}: $${amt.toFixed(2)} (${((amt/total)*100).toFixed(0)}%)`)
        .join('<br>');

      el.innerHTML = `<strong>Total Spent:</strong> $${total.toFixed(2)}<br><br><strong>Category Breakdown:</strong><br>${breakdown}`;
    }

    function exportCSV() {
      let csv = 'Date,Merchant,Category,Amount\n';
      transactions.forEach(t => csv += `"${t.date}","${t.merchant}","${t.category}",${t.amount}\n`);
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'dollar_tracker_export.csv');
      a.click();
    }

    function clearAllData() {
      if (confirm('Are you sure you want to delete all transaction records?')) {
        transactions = [];
        saveToStorage();
      }
    }

    render();
  </script>
</body>
</html>
